<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Cidades a Partir de Estados</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        label,
        select {
            display: block;
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
        }

        label {
            margin-top: 15px;
            margin-bottom: 5px;
        }

        select {
            padding: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 25px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>Lista de cidades a partir de estados</h1>

    <label for="selectEstado">Estado:</label>
    <select id="selectEstado">
        <option value="">Selecione um estado</option>
    </select>

    <label for="selectCidade">Selecione a Cidade:</label>
    <select id="selectCidade" disabled>
        <option value="">Selecione um estado primeiro</option>
    </select>

    <div id="resultado"></div>

    <script>
        const selectEstado = document.getElementById('selectEstado');
        const selectCidade = document.getElementById('selectCidade');
        const divResultado = document.getElementById('resultado');

        let estadosData = {};

        async function carregarEstados() {
            try {
                const response = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados');
                const estados = await response.json();

                // Ordenar os estados alfabeticamente pelo nome
                estados.sort((a, b) => a.nome.localeCompare(b.nome));

                estados.forEach(estado => {
                    estadosData[estado.sigla] = estado.nome;

                    const option = document.createElement('option');
                    option.value = estado.sigla; // Usamos a sigla (UF) para buscar as cidades depois
                    option.textContent = estado.nome;
                    selectEstado.appendChild(option);
                });
            } catch (erro) {
                console.error('Erro ao carregar estados:', erro);
            }
        }

        selectEstado.addEventListener('change', async function () {
            const uf = selectEstado.value;

            selectCidade.innerHTML = '<option value="">Selecione uma cidade</option>';
            divResultado.textContent = '';

            if (!uf) {
                selectCidade.disabled = true;
                selectCidade.innerHTML = '<option value="">Selecione um estado primeiro</option>';
                return;
            }

            try {
                const response = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios`);
                const cidades = await response.json();

                cidades.sort((a, b) => a.nome.localeCompare(b.nome));

                cidades.forEach(cidade => {
                    const option = document.createElement('option');
                    option.value = cidade.nome;
                    option.textContent = cidade.nome;
                    selectCidade.appendChild(option);
                });

                selectCidade.disabled = false;
            } catch (erro) {
                console.error('Erro ao carregar cidades:', erro);
            }
        });

        selectCidade.addEventListener('change', function () {
            const ufSelecionada = selectEstado.value;
            const cidadeSelecionada = selectCidade.value;

            if (cidadeSelecionada && ufSelecionada) {
                const nomeEstado = estadosData[ufSelecionada];
                divResultado.textContent = `Você selecionou: ${cidadeSelecionada} - ${nomeEstado}`;
            } else {
                divResultado.textContent = '';
            }
        });

        carregarEstados();
    </script>

</body>

</html>
